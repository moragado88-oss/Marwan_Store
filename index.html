<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassan Gad English Academy</title>
<style>
:root{--navy:#101d35;--blue:#2463a5;--cyan:#52c7ee;--bg:#f2f5fa;--ink:#17243a;--muted:#718096;--line:#e3eaf2;--green:#16865c;--red:#c43d4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:var(--blue);color:white}
header{background:linear-gradient(115deg,#101d35,#1c426d);color:#fff;padding:19px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand b{font-size:22px;letter-spacing:1px}.brand small{display:block;color:#83dfff;letter-spacing:2px;margin-top:5px}
header .sub{color:#dceafa;font-size:13px}
nav{background:#1b3152;display:flex;gap:6px;overflow-x:auto;padding:10px 4%;position:sticky;top:0;z-index:5}
nav button{background:transparent;color:#e9f2ff;white-space:nowrap;padding:10px 13px}nav button.active,nav button:hover{background:#315783}
main{max-width:1250px;margin:25px auto;padding:0 16px;min-height:72vh}
h1{font-size:25px;margin:5px 0 18px}h2{font-size:18px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:15px 0 22px}
.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 5px 18px #19375a08}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:10px;color:#1c426d}
.panel{margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;color:#526176;font-size:13px;margin:8px 0 5px}
input,select,textarea{width:100%;border:1px solid #d8e1eb;border-radius:9px;padding:11px;background:#fff;color:var(--ink);outline-color:#80c8ed}
textarea{min-height:70px;resize:vertical}.primary{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.gray{background:#65758b}.wa{background:#168b57;text-decoration:none;color:white;border-radius:8px;padding:8px 10px;display:inline-block;font-size:13px}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:11px;border-bottom:1px solid #edf1f5;font-size:13px}th{color:#53657b;background:#f8fafc}
.tablewrap{overflow:auto}.hint{padding:12px 14px;background:#e8f5ff;border-radius:10px;color:#315a7a;line-height:1.8}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 10px}.empty{color:var(--muted);text-align:center;padding:25px}
#login{position:fixed;inset:0;background:linear-gradient(130deg,#101d35,#1e4b78);display:grid;place-items:center;z-index:20;padding:18px}
.loginbox{width:min(420px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 25px 70px #0004;text-align:center}
.loginbox h1{color:var(--navy);margin:0}.loginbox p{color:#2388bb;letter-spacing:2px;margin:8px 0 22px}
.loginbox button{width:100%;margin-top:12px}.loginbox small{display:block;color:#8a6a2c;margin-top:14px}
footer{text-align:center;padding:22px;color:#8b98a8;font-size:12px}
.toast{position:fixed;bottom:18px;left:18px;background:#142a47;color:#fff;padding:12px 17px;border-radius:10px;display:none;z-index:50}
@media(max-width:600px){header{padding:15px}.brand b{font-size:18px}h1{font-size:21px}.panel{padding:13px}nav{padding:8px}}
</style>
</head>
<body>
<div id="login"><div class="loginbox"><h1>HASSAN GAD</h1><p>ENGLISH ACADEMY</p><label style="text-align:right">كلمة مرور الأدمن</label><input id="pass" type="password" placeholder="اكتب كلمة المرور" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">دخول المنصة</button><small>كلمة المرور المبدئية: 2026</small></div></div>
<header><div class="brand"><b>HASSAN GAD</b><small>ENGLISH ACADEMY</small></div><div class="sub">نظام إدارة الطلاب والكورسات</div><div class="actions"><button class="gray" onclick="backup()">نسخة احتياطية</button><button class="gray" onclick="document.getElementById('restore').click()">استعادة نسخة</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreData(event)"><button class="red" onclick="logout()">خروج</button></div></header>
<nav id="nav">
<button data-page="home" class="active" onclick="show('home')">الرئيسية</button>
<button data-page="students" onclick="show('students')">الطلاب</button>
<button data-page="courses" onclick="show('courses')">الكورسات</button>
<button data-page="attendance" onclick="show('attendance')">الحضور والغياب</button>
<button data-page="grades" onclick="show('grades')">درجات الشيت</button>
<button data-page="payments" onclick="show('payments')">المدفوعات</button>
</nav><main id="app"></main><footer>© <span id="year"></span> HASSAN GAD ENGLISH ACADEMY</footer><div id="toast" class="toast"></div>
<script>
const KEY='hassan_gad_academy_local_v1';
let db={students:[],courses:[],attendance:[],grades:[],payments:[]};
try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function login(){if(document.getElementById('pass').value==='2026'){sessionStorage.setItem('hga_auth','1');document.getElementById('login').style.display='none';show('home')}else toast('كلمة المرور غير صحيحة')}
function logout(){sessionStorage.removeItem('hga_auth');document.getElementById('login').style.display='grid'}
if(sessionStorage.getItem('hga_auth')==='1')document.getElementById('login').style.display='none';
document.getElementById('year').textContent=new Date().getFullYear();
function show(page){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let root=document.getElementById('app');root.innerHTML=views[page]();if(page==='students')renderStudents();if(page==='attendance')renderAttendance();if(page==='grades')renderGrades();if(page==='payments')renderPayments();if(page==='courses')renderCourses()}
function studentSelect(){return '<option value="">اختر الطالب</option>'+db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
const views={
home:()=>`<h1>لوحة التحكم</h1><section class="stats">
<div class="stat"><small>إجمالي الطلاب</small><strong>${db.students.length}</strong></div>
<div class="stat"><small>حضور اليوم</small><strong>${db.attendance.filter(x=>x.date===today()&&x.status==='حضور').length}</strong></div>
<div class="stat"><small>غياب اليوم</small><strong>${db.attendance.filter(x=>x.date===today()&&x.status==='غياب').length}</strong></div>
<div class="stat"><small>إجمالي المدفوعات</small><strong>${db.payments.reduce((a,x)=>a+Number(x.amount),0).toFixed(2)} ج.م</strong></div></section>
<div class="hint">كل البيانات محفوظة على نفس الجهاز والمتصفح. استخدم زر «نسخة احتياطية» بانتظام للاحتفاظ بنسخة من بياناتك.</div>
<div class="panel"><h2>اختصارات سريعة</h2><div class="actions"><button onclick="show('students')">إضافة طالب</button><button onclick="show('attendance')">تسجيل حضور</button><button onclick="show('grades')">إضافة درجة</button><button onclick="show('payments')">تسجيل دفعة</button></div></div>`,
students:()=>`<h1>إدارة الطلاب</h1><div class="panel"><h2>إضافة طالب جديد</h2><form id="studentForm" class="grid">
<div><label>اسم الطالب *</label><input name="name" required></div><div><label>رقم ولي الأمر *</label><input name="phone" placeholder="01012345678" required></div><div><label>المرحلة / الصف</label><input name="grade"></div><div><label>المجموعة</label><input name="group"></div><div style="grid-column:1/-1"><label>ملاحظات</label><textarea name="notes"></textarea></div><div><button>حفظ الطالب</button></div></form></div><div class="panel"><h2>قائمة الطلاب</h2><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>رقم ولي الأمر</th><th>الصف</th><th>المجموعة</th><th>واتساب</th><th>إجراءات</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`,
courses:()=>`<h1>الكورسات والمجموعات</h1><div class="panel"><h2>إضافة كورس</h2><form id="courseForm" class="grid"><div><label>اسم الكورس *</label><input name="title" required></div><div><label>المجموعة</label><input name="group"></div><div><label>السعر بالجنيه</label><input name="price" type="number" min="0" step=".01" value="0"></div><div><label>تفاصيل</label><input name="details"></div><div><button>إضافة الكورس</button></div></form></div><div class="panel"><h2>الكورسات المسجلة</h2><div class="tablewrap"><table><thead><tr><th>الكورس</th><th>المجموعة</th><th>السعر</th><th>التفاصيل</th><th></th></tr></thead><tbody id="courseRows"></tbody></table></div></div>`,
attendance:()=>`<h1>الحضور والغياب</h1><div class="panel"><h2>تسجيل حالة طالب</h2><form id="attendanceForm" class="grid"><div><label>الطالب</label><select name="student" required>${studentSelect()}</select></div><div><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div><label>الحالة</label><select name="status"><option>حضور</option><option>غياب</option><option>تأخير</option></select></div><div><label>ملاحظات</label><input name="notes"></div><div><button>حفظ الحالة</button></div></form></div><div class="panel"><h2>سجل الحضور</h2><div class="tablewrap"><table><thead><tr><th>الطالب</th><th>التاريخ</th><th>الحالة</th><th>واتساب ولي الأمر</th><th></th></tr></thead><tbody id="attendanceRows"></tbody></table></div></div>`,
grades:()=>`<h1>درجات الشيت والامتحانات</h1><div class="panel"><h2>إضافة درجة</h2><form id="gradeForm" class="grid"><div><label>الطالب</label><select name="student" required>${studentSelect()}</select></div><div><label>اسم الشيت</label><input name="sheet" required placeholder="Sheet 1"></div><div><label>الدرجة</label><input name="score" type="number" min="0" step=".5" required></div><div><label>من</label><input name="max" type="number" min=".5" step=".5" required></div><div><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div><button>حفظ الدرجة</button></div></form></div><div class="panel"><h2>سجل الدرجات</h2><div class="tablewrap"><table><thead><tr><th>الطالب</th><th>الشيت</th><th>الدرجة</th><th>التاريخ</th><th>واتساب</th><th></th></tr></thead><tbody id="gradeRows"></tbody></table></div></div>`,
payments:()=>`<h1>المدفوعات</h1><div class="panel"><h2>تسجيل دفعة</h2><form id="paymentForm" class="grid"><div><label>الطالب</label><select name="student" required>${studentSelect()}</select></div><div><label>المبلغ بالجنيه</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>تاريخ الدفع</label><input name="date" type="date" value="${today()}" required></div><div><label>وصف الدفعة</label><input name="description" placeholder="اشتراك شهر نوفمبر"></div><div><button>حفظ الدفعة</button></div></form></div><div class="panel"><h2>سجل المدفوعات</h2><div class="tablewrap"><table><thead><tr><th>الطالب</th><th>المبلغ</th><th>التاريخ</th><th>الوصف</th><th>واتساب</th><th></th></tr></thead><tbody id="paymentRows"></tbody></table></div></div>`
};
function student(id){return db.students.find(s=>s.id===id)}
function phoneLink(phone,msg){let n=String(phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='2'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
function waBtn(s,msg,label='واتساب'){return `<a class="wa" target="_blank" rel="noopener" href="${phoneLink(s.phone,msg)}">${label}</a>`}
function renderStudents(){document.getElementById('studentRows').innerHTML=db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.grade)}</td><td>${esc(s.group)}</td><td>${waBtn(s,`مرحباً ولي أمر الطالب ${s.name}، مع تحيات مستر حسن جاد - أكاديمية اللغة الإنجليزية.`)}</td><td><div class="actions"><button class="gray" onclick="editStudent('${s.id}')">تعديل</button><button class="red" onclick="del('students','${s.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد طلاب حتى الآن</td></tr>';
document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.students.push({id:id(),name:f.get('name').trim(),phone:f.get('phone').trim(),grade:f.get('grade'),group:f.get('group'),notes:f.get('notes')});save();show('students');toast('تم حفظ الطالب')}}
function editStudent(i){let s=student(i);let n=prompt('اسم الطالب',s.name);if(n===null)return;let p=prompt('رقم ولي الأمر',s.phone);if(p===null)return;s.name=n.trim();s.phone=p.trim();save();show('students');toast('تم التعديل')}
function renderCourses(){document.getElementById('courseRows').innerHTML=db.courses.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.group)}</td><td>${esc(c.price)} ج.م</td><td>${esc(c.details)}</td><td><button class="red" onclick="del('courses','${c.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد كورسات</td></tr>';document.getElementById('courseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.courses.push({id:id(),title:f.get('title'),group:f.get('group'),price:f.get('price'),details:f.get('details')});save();show('courses');toast('تم إضافة الكورس')}}
function renderAttendance(){document.getElementById('attendanceRows').innerHTML=[...db.attendance].reverse().map(a=>{let s=student(a.student);if(!s)return '';let msg=`تنبيه من مستر حسن جاد: الطالب ${s.name}، حالة الحضور بتاريخ ${a.date}: ${a.status}.`;return `<tr><td>${esc(s.name)}</td><td>${esc(a.date)}</td><td>${esc(a.status)}</td><td>${waBtn(s,msg,'إرسال إشعار')}</td><td><button class="red" onclick="del('attendance','${a.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">لا توجد سجلات</td></tr>';document.getElementById('attendanceForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.attendance.push({id:id(),student:f.get('student'),date:f.get('date'),status:f.get('status'),notes:f.get('notes')});save();show('attendance');toast('تم تسجيل الحالة')}}
function renderGrades(){document.getElementById('gradeRows').innerHTML=[...db.grades].reverse().map(g=>{let s=student(g.student);if(!s)return '';let msg=`نتيجة الطالب ${s.name} في ${g.sheet}: ${g.score} من ${g.max} بتاريخ ${g.date}. مع تحيات مستر حسن جاد.`;return `<tr><td>${esc(s.name)}</td><td>${esc(g.sheet)}</td><td>${esc(g.score)} / ${esc(g.max)}</td><td>${esc(g.date)}</td><td>${waBtn(s,msg,'إرسال الدرجة')}</td><td><button class="red" onclick="del('grades','${g.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">لا توجد درجات</td></tr>';document.getElementById('gradeForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(Number(f.get('score'))>Number(f.get('max'))){toast('الدرجة لا يمكن أن تكون أكبر من الدرجة النهائية');return}db.grades.push({id:id(),student:f.get('student'),sheet:f.get('sheet'),score:f.get('score'),max:f.get('max'),date:f.get('date')});save();show('grades');toast('تم حفظ الدرجة')}}
function renderPayments(){document.getElementById('paymentRows').innerHTML=[...db.payments].reverse().map(p=>{let s=student(p.student);if(!s)return '';let msg=`تم تسجيل استلام مبلغ ${p.amount} جنيه للطالب ${s.name} بتاريخ ${p.date}${p.description?' عن '+p.description:''}. شكراً لكم - مستر حسن جاد.`;return `<tr><td>${esc(s.name)}</td><td>${esc(p.amount)} ج.م</td><td>${esc(p.date)}</td><td>${esc(p.description)}</td><td>${waBtn(s,msg,'تأكيد الدفع')}</td><td><button class="red" onclick="del('payments','${p.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">لا توجد مدفوعات</td></tr>';document.getElementById('paymentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.payments.push({id:id(),student:f.get('student'),amount:f.get('amount'),date:f.get('date'),description:f.get('description')});save();show('payments');toast('تم تسجيل الدفعة')}}
function del(table,i){if(!confirm('متأكد من الحذف؟'))return;db[table]=db[table].filter(x=>x.id!==i);save();let p=({students:'students',courses:'courses',attendance:'attendance',grades:'grades',payments:'payments'})[table];show(p);toast('تم الحذف')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hassan-gad-academy-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تنزيل النسخة الاحتياطية')}
function restoreData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.courses)throw Error();db={...db,...x};save();show('home');toast('تم استعادة البيانات')}catch(err){toast('ملف النسخة غير صالح')}};r.readAsText(file);e.target.value=''}
show('home');
</script></body></html>
