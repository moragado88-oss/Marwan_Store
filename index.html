<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARO STORE | متجر مروان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a0a0a;color:#fff}
header{background:#111;padding:20px;text-align:center;border-bottom:3px solid #ff4500;position:sticky;top:0;z-index:10}
header h1{color:#ff4500;font-weight:900;font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:20px;max-width:1100px;margin:auto}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:18px}
.card:hover{border-color:#ff4500}
.badge{background:#ff45001a;color:#ff4500;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.price{color:#00ff88;font-size:22px;font-weight:900;margin:10px 0}
.btn{background:linear-gradient(135deg,#ff4500,#ff7a00);color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:800;cursor:pointer}
.footer{text-align:center;padding:30px;color:#888;border-top:1px solid #222;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>🔥 MARO STORE</h1>
<p>أسرع متجر خدمات - فودافون كاش 01030980823</p>
</header>
<div id="loading" style="text-align:center;padding:80px">جاري التحميل... ⏳</div>
<div id="grid" class="grid"></div>
<div class="footer">للتواصل واتساب: 01030980823 | كاش: 01030980823</div>
<script>
const SUPABASE_URL='https://wplwwebfgthhslypirrja.supabase.co';
const SUPABASE_KEY='sb_publishable_cXauQ7QoodGbF_LEHj5z5Q_t3KDAdYZ';
const WHATSAPP='201030980823';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){
 const{data}=await supabaseClient.from('services').select('*').eq('active',true).order('id',{ascending:true});
 document.getElementById('loading').style.display='none';
 let g=document.getElementById('grid');
 if(!data||data.length==0){g.innerHTML='<div style=text-align:center;grid-column:1/-1;padding:60px>المتجر فاضي - ادخل لوحة الأدمن وضيف خدماتك<br><a href=admin.html style=color:#ff4500>فتح الأدمن</a></div>';return}
 g.innerHTML=data.map(s=>`<div class=card><div class=badge>${s.platform}</div><div style=font-weight:900;font-size:18px;margin:8px 0>${s.title}</div><div class=price>${s.price} جنيه</div><input id="link-${s.id}" placeholder="حط لينك حسابك هنا" style="width:100%;padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;margin:8px 0"><button class=btn onclick="order(${s.id},'${s.title}','${s.platform}','${s.price}')">طلب واتساب 🚀</button></div>`).join('');
}
async function order(id,title,platform,price){
 let link=document.getElementById('link-'+id).value||'بدون لينك';
 let customer=prompt('اكتب اسمك:')||'عميل';
 // يحفظ الطلب في لوحة الأدمن عندك
 await supabaseClient.from('orders').insert({customer_name:customer,service:title,amount:platform+' - '+price+'ج - اللينك: '+link,status:'pending'});
 var msg=`طلب جديد MARO STORE 🔥%0Aالاسم: ${customer}%0Aالخدمة: ${title}%0Aالمنصة: ${platform}%0Aالسعر: ${price} جنيه%0Aاللينك: ${link}%0A%0Aالدفع: فودافون كاش 01030980823`;
 window.open('https://wa.me/'+WHATSAPP+'?text='+msg,'_blank');
}
load();
</script>
</body>
</html>
